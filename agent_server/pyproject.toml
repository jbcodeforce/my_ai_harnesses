[project]
name = "my-ai-agents"
version = "0.1.0"
description = "A set of agents to do some work for me"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.8",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "openai>=2.45.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]



[project.scripts]
db_review_agent = "agents.db_review"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]
