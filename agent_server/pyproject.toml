[project]
name = "my-ai-agents"
version = "0.1.0"
description = "A set of agents to do some work for me"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.8",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "openai>=2.45.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "sqlalchemy>=2.1.3",
    "typer>=0.12.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project.scripts]
db-review-agent = "agents.db_review:main"
book-sync = "cli.book_sync:main"
book-sync-agent = "agents.book_sync:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "cli*"]
